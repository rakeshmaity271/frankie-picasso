<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Frankie Picasso — entrepreneur, author, broadcaster, and leader. Explore four decades of platform building, community impact, and legacy." />
    <meta name="theme-color" content="#3D1C3E" />
    <title>Frankie Picasso | Platform Builder. Leader. Legacy.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Frankie Picasso | Platform Builder. Leader. Legacy." />
    <meta property="og:description" content="Frankie Picasso — entrepreneur, author, broadcaster, and leader. Explore four decades of platform building, community impact, and legacy." />
    <meta property="og:type" content="website" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Frankie Picasso | Platform Builder. Leader. Legacy." />
    <meta name="twitter:description" content="Frankie Picasso — entrepreneur, author, broadcaster, and leader. Explore four decades of platform building, community impact, and legacy." />
    
    <!-- Font preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Loading screen -->
    <style>
      body { margin: 0; background: #3D1C3E; }
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #3D1C3E;
        z-index: 9999;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #loader.hidden {
        opacity: 0;
        visibility: hidden;
      }
      #loader span {
        font-family: Georgia, serif;
        font-size: 3rem;
        color: #C5A55A;
        letter-spacing: 0.1em;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="loader"><span>FP</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
